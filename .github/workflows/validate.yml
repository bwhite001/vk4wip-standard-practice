name: Check questions

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate question bank
        run: node tools/validate-questions.mjs
      - name: Unit tests
        run: node tools/test-exam.mjs
